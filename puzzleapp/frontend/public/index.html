<!DOCTYPE html>
<html lang="hu">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Puzzle Kirakós – moduláris</title>
  <link rel="stylesheet" href="../src/styles/main.css" />
</head>
<body class="aside-open">
  <header>
    <h1 data-i18n="title">🧩 Puzzle Kirakós – moduláris</h1>
    <div class="header-right">
      <div class="subtitle" data-i18n="subtitle">Mátrix-grid | pontos snap | szomszéd-merge</div>
      <div class="lang-switch">
        <button class="lang-btn" type="button" data-lang="hu" aria-label="Magyar">🇭🇺</button>
        <button class="lang-btn" type="button" data-lang="en" aria-label="English">🇬🇧</button>
      </div>
    </div>
  </header>

  <section id="startScreen" class="start-screen">
    <div class="start-inner">
      <div class="start-left">
        <h2 data-i18n="startTitle">Puzzle kiválasztása</h2>
        <p class="start-hint" data-i18n="startHint">Válassz képet a galériából, majd add meg a méretet.</p>
        <div id="galleryGrid" class="gallery-grid"></div>
      </div>
      <div class="start-right">
        <h3 data-i18n="sizeTitle">Méret</h3>
        <div id="sizeOptions" class="size-options"></div>
        <button id="startGame" class="primary" type="button" disabled data-i18n="startGame">Játék indítása</button>
        <div id="startLoading" class="hint" style="display:none;" data-i18n="loading">Betöltés…</div>
      </div>
    </div>
  </section>

  <div id="root">
    <main id="stage">
      <div id="board"><div id="canvasHost"></div></div>
    </main>
    <aside>
      <div class="side-inner">
        <div class="side-header" data-i18n="settingsTitle">Beállítások</div>
        <div class="side-scroll">
          <div class="group">
            <h3 data-i18n="puzzleGroup">Puzzle</h3>
            <div class="row"><button id="openGallery" class="ghost" type="button" data-i18n="openGallery">Galéria megnyitása</button></div>
          </div>

          <div class="group">
            <h3 data-i18n="snapGroup">Mozgatás / Snap</h3>
            <div class="row"><label for="snapToggle" data-i18n="snapToOrigin">Snap az eredeti helyre</label><input type="checkbox" id="snapToggle" checked /></div>
            <div class="row"><label for="snapPct" data-i18n="snapThreshold">Snap küszöb</label><input type="range" id="snapPct" min="0" max="100" value="40" /></div>
            <div class="row"><button id="shuffle" class="ghost" type="button" data-i18n="shuffle">Szétkeverés</button></div>
            <div class="row"><button id="clear" class="ghost" type="button" data-i18n="clear">Törlés</button></div>
          </div>

          <div class="group">
            <h3 data-i18n="displayGroup">Megjelenítés</h3>
            <div class="row"><label for="pieceScaleRange" data-i18n="pieceSize">Darab méret</label><input type="range" id="pieceScaleRange" min="30" max="150" value="70" /></div>
            <div class="row"><span class="hint"><span data-i18n="current">Aktuális:</span> <b id="pieceScaleLbl">70%</b></span></div>
            <div class="row"><label for="outlineToggle" data-i18n="outline">Kontúr</label><input type="checkbox" id="outlineToggle" checked /></div>
            <div class="row"><label for="outlineWidth" data-i18n="outlineWidth">Kontúr vastagság</label><input type="range" id="outlineWidth" min="1" max="3" value="1" /></div>
            <div class="row"><span class="hint"><span data-i18n="current">Aktuális:</span> <b id="outlineWidthLbl">1px</b></span></div>
            <div class="row"><label for="shadowToggle" data-i18n="shadow">3D árnyék</label><input type="checkbox" id="shadowToggle" checked /></div>
            <div class="row"><label for="shadowIntensity" data-i18n="shadowIntensity">Árnyék intenzitás</label><input type="range" id="shadowIntensity" min="0" max="100" value="35" /></div>
            <div class="row"><span class="hint"><span data-i18n="current">Aktuális:</span> <b id="shadowIntensityLbl">35%</b></span></div>
          </div>
        </div>
      </div>
    </aside>
  </div>

  <button id="toggleAside" data-i18n="toggleSettings">⚙️ Beállítások</button>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/p5.min.js"></script>
  <script type="module" src="../src/main.js"></script>
</body>
</html>
